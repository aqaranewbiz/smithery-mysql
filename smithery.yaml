name: mysql-mcp-server
description: MySQL 데이터베이스에 대한 쿼리 실행을 지원하는 MCP 서버
version: 1.0.0

build:
  dockerfile: Dockerfile
  context: .

runtime:
  port: 8000
  health_check:
    path: /status
    interval: 30s
    timeout: 10s
    retries: 3

environment:
  - name: MYSQL_HOST
    description: MySQL 서버 호스트
    required: true
  - name: MYSQL_USER
    description: MySQL 사용자 이름
    required: true
  - name: MYSQL_PASSWORD
    description: MySQL 비밀번호
    required: true
  - name: MYSQL_DATABASE
    description: MySQL 데이터베이스 이름
    required: true 